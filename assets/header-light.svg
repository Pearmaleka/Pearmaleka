<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Le Nam Khanh: statistics of evaluation">
<style>
.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.name{font-size:34px;font-weight:700;fill:#1f1f1e}
.sub{font-size:15px;fill:#6b6a63}
.type{clip-path:inset(0 100% 0 0);animation:type 1.6s steps(14) .2s forwards}
.fade{opacity:0;animation:fade .8s ease 1.9s forwards}
.fade2{opacity:0;animation:fade .8s ease 2.4s forwards}
.draw1{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.2s ease-out 1.8s forwards}
.draw2{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.2s ease-out 4.2s forwards}
.lab1{opacity:0;animation:fade .6s ease 3.9s forwards}
.lab2{opacity:0;animation:fade .6s ease 6.3s forwards}
.cur{animation:blink 1s step-end infinite}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.type,.fade,.fade2,.draw1,.draw2,.lab1,.lab2{animation:none;opacity:1;clip-path:none;stroke-dashoffset:0}}
</style>
